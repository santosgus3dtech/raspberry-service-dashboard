services:
  raspberry-service-dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.example
    ports:
      - "8080:8080"
    env_file:
      - ../examples/dashboard.env.example
    environment:
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ROOT: /host/root
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
