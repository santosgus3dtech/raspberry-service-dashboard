<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Raspberry Service Dashboard preview</title>
  <desc id="desc">Dashboard preview showing system metrics, monitored services, webhook URL and redacted logs.</desc>
  <rect width="1120" height="620" rx="18" fill="#f7f8f3"/>
  <rect x="42" y="40" width="1036" height="540" rx="14" fill="#fffdf8" stroke="#d9dfcf" stroke-width="2"/>
  <text x="86" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="850" fill="#1a1918">Raspberry Service Dashboard</text>
  <text x="86" y="124" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#657166">Headless Raspberry Pi service health, logs and controlled restarts</text>
  <rect x="820" y="72" width="190" height="38" rx="19" fill="#f0fdf4" stroke="#16a34a"/>
  <circle cx="846" cy="91" r="7" fill="#16a34a"/>
  <text x="864" y="97" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#166534">Instagram online</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="86" y="170" width="180" height="110" rx="10" fill="#ffffff" stroke="#d9dfcf"/>
    <text x="110" y="202" font-size="12" font-weight="800" fill="#657166">UPTIME</text>
    <text x="110" y="244" font-size="30" font-weight="850" fill="#1a1918">12d 4h</text>
    <rect x="294" y="170" width="180" height="110" rx="10" fill="#ffffff" stroke="#d9dfcf"/>
    <text x="318" y="202" font-size="12" font-weight="800" fill="#657166">MEMORY</text>
    <text x="318" y="244" font-size="30" font-weight="850" fill="#1a1918">48%</text>
    <rect x="502" y="170" width="180" height="110" rx="10" fill="#ffffff" stroke="#d9dfcf"/>
    <text x="526" y="202" font-size="12" font-weight="800" fill="#657166">DISK</text>
    <text x="526" y="244" font-size="30" font-weight="850" fill="#1a1918">37%</text>
    <rect x="710" y="170" width="180" height="110" rx="10" fill="#ffffff" stroke="#d9dfcf"/>
    <text x="734" y="202" font-size="12" font-weight="800" fill="#657166">TEMP</text>
    <text x="734" y="244" font-size="30" font-weight="850" fill="#1a1918">46 C</text>
  </g>

  <rect x="86" y="320" width="430" height="96" rx="10" fill="#f0f5e8" stroke="#d9dfcf"/>
  <text x="116" y="356" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="850" fill="#1a1918">instagram-stl-auto-dm</text>
  <text x="116" y="384" font-family="Consolas,monospace" font-size="13" fill="#657166">state=active pid=1243 restarts=0</text>
  <rect x="386" y="344" width="92" height="36" rx="8" fill="#c51f46"/>
  <text x="410" y="367" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">Restart</text>

  <rect x="560" y="320" width="430" height="96" rx="10" fill="#f0f5e8" stroke="#d9dfcf"/>
  <text x="590" y="356" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="850" fill="#1a1918">instagram-stl-auto-dm-tunnel</text>
  <text x="590" y="384" font-family="Consolas,monospace" font-size="13" fill="#657166">webhook=https://example.trycloudflare.com/webhook</text>

  <rect x="86" y="454" width="904" height="76" rx="10" fill="#101511"/>
  <text x="116" y="484" font-family="Consolas,monospace" font-size="13" fill="#d7f7d5">2026-08-26 service started</text>
  <text x="116" y="510" font-family="Consolas,monospace" font-size="13" fill="#d7f7d5">GET /webhook?access_token=&lt;redacted&gt; 200 OK</text>
</svg>
